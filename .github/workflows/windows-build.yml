name: Build Windows app

# Builds the DriveSync desktop client for Windows and publishes an MSI installer
# and a portable ZIP as workflow artifacts. Windows only, by design.

on:
  push:
    branches: [windowsv]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        run: ./gradlew :core:test --no-daemon

      - name: Build MSI installer
        run: ./gradlew :desktop:packageReleaseMsi --no-daemon

      - name: Build portable distribution
        run: ./gradlew :desktop:createReleaseDistributable --no-daemon

      - name: Zip portable distribution
        shell: pwsh
        run: |
          $appDir = Get-ChildItem -Directory "desktop/build/compose/binaries/main-release/app" | Select-Object -First 1
          Compress-Archive -Path "$($appDir.FullName)\*" -DestinationPath "DriveSync-windows-portable.zip"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveSync-windows-msi
          path: desktop/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveSync-windows-portable
          path: DriveSync-windows-portable.zip
          if-no-files-found: error
