import org.jetbrains.compose.desktop.application.dsl.TargetFormat

plugins {
    alias(libs.plugins.kotlin.jvm)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.jetbrains.compose)
    alias(libs.plugins.kotlin.serialization)
}

// Windows desktop client. Packaging (MSI) requires JDK 17+ with jpackage — built in CI.

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation project(':core')

    implementation compose.desktop.currentOs
    implementation compose.material3
    implementation compose.materialIconsExtended

    implementation libs.coroutines.swing
    implementation libs.kotlinx.serialization.json

    // Google Drive v3 + installed-app OAuth (browser + loopback redirect)
    implementation(libs.google.api.client) {
        exclude group: 'org.apache.httpcomponents'
    }
    implementation(libs.google.api.services.drive) {
        exclude group: 'org.apache.httpcomponents'
    }
    implementation libs.google.oauth.client.jetty
}

compose.desktop {
    application {
        mainClass = 'com.iamsubho.drivesync.desktop.MainKt'
        nativeDistributions {
            targetFormats(TargetFormat.Msi)
            packageName = 'DriveSync'
            packageVersion = '1.0.0'
            vendor = 'Subhojit Kundu (iam-subho)'
            description = 'Sync local folders with Google Drive'
            windows {
                menu = true
                shortcut = true
                upgradeUuid = '9f6f2c3e-1f4c-4a56-9d0a-3b7a51c2e8d4'
            }
        }
    }
}
